name: "CI: mypy primer run"

on:
  # Only run on PR, since we diff against master
  pull_request:
    paths:
    - 'pyrefly/lib/**'
    - 'pyrefly/third_party/**'
    - '.github/workflows/ci_mypy_primer_run.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mypy_primer:
    name: Run mypy_primer
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard-index: [0, 1]
      fail-fast: false
    steps:
      # VALIDATION COPY NOTE (baseline producer on a non-default branch only):
      # replaces the real 15-shard cargo build + mypy_primer corpus run, which
      # cannot complete in this copy. Workflow name, artifact name, and artifact
      # layout are unchanged so the `workflow_run` listener sees the same
      # upstream interface it has in production.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run mypy_primer
        shell: bash
        run: |
          if [ "${{ matrix.shard-index }}" = "0" ]; then
            {
              printf '%s\n' 'black (https://github.com/psf/black)'
              printf '%s\n' '+ Reused variable name `n`: `n` [bad-assignment]'
              printf '%s\n' '+ Argument `args` is missing [bad-argument-count]'
              printf '\n'
              printf '%s\n' 'django (https://github.com/django/django)'
              printf '%s\n' '- Fixed error [bad-return]'
            } > diff_0.txt
          else
            : > diff_${{ matrix.shard-index }}.txt
          fi
      - if: ${{ matrix.shard-index == 0 }}
        name: Save PR number
        run: |
          echo ${{ github.event.pull_request.number }} | tee pr_number.txt
      - name: Upload mypy_primer diff + PR number
        uses: actions/upload-artifact@v6
        if: ${{ matrix.shard-index == 0 }}
        with:
          name: mypy_primer_diffs-${{ matrix.shard-index }}
          path: |
            diff_${{ matrix.shard-index }}.txt
            pr_number.txt
      - name: Upload mypy_primer diff
        uses: actions/upload-artifact@v6
        if: ${{ matrix.shard-index != 0 }}
        with:
          name: mypy_primer_diffs-${{ matrix.shard-index }}
          path: diff_${{ matrix.shard-index }}.txt

  join_artifacts:
    name: Join artifacts
    runs-on: ubuntu-latest
    needs: [mypy_primer]
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: mypy_primer_diffs
          pattern: mypy_primer_diffs-*
          delete-merged: true
